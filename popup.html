<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 200px; font-family: Arial, sans-serif; padding: 10px; }
    button { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; }
    .status { font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h3>Roteador Helper</h3>
  <p>Status: <span class="status">Ativo</span></p>
  <hr>
  <button id="btnManual">Inserção Manual</button>
  <script>
    document.getElementById('btnManual').addEventListener('click', () => {
        alert('Modo manual ativado. Insira os dados na página.');
    });
  </script>
</body>
</html>
